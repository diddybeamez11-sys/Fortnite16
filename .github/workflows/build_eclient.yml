name: Build E-Client Android 1.21.80.3

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '12266719'
          packages: ''

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"
          set +o pipefail
          yes | sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" --licenses >/dev/null || true
          set -o pipefail

      - name: Prepare protocol 800 source
        shell: bash
        run: bash ./scripts/bootstrap_protocol.sh 3.0

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug --stacktrace
        env:
          GRADLE_OPTS: '-Dorg.gradle.daemon=false -Xmx4g'

      - name: Verify 1.21.80.3 native profile
        shell: bash
        run: |
          set -euo pipefail
          test -f app/src/main/assets/runtime/1.21.80-arm64-profile.json
          grep -q '"minecraft_version": "1.21.80.3"' app/src/main/assets/runtime/1.21.80-arm64-profile.json
          grep -q '"protocol_version": 800' app/src/main/assets/runtime/1.21.80-arm64-profile.json
          test -f native/runtime/CMakeLists.txt
          test -f native/runtime/src/main.cpp

      - uses: actions/upload-artifact@v4
        with:
          name: eclient-1.21.80.3-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
